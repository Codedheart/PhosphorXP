# Builds the no-Python Windows download on GitHub's servers.
#
#  * Push a tag like v1.0  ->  a Release is created with PhosphorXP-windows.zip attached.
#  * Actions tab > "Build Windows release" > Run workflow  ->  test build you can download
#    from the run page (no release is created).
name: Build Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.3" pytest

      - name: Run tests
        run: python -m pytest -q tests

      - name: Fetch VT323 font
        shell: pwsh
        run: |
          Invoke-WebRequest -UseBasicParsing 'https://github.com/google/fonts/raw/main/ofl/vt323/VT323-Regular.ttf' -OutFile 'phosphor/assets/VT323-Regular.ttf'
          Invoke-WebRequest -UseBasicParsing 'https://github.com/google/fonts/raw/main/ofl/vt323/OFL.txt' -OutFile 'phosphor/assets/VT323-OFL.txt'

      - name: Stamp version from tag
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          "VERSION = '$($env:GITHUB_REF_NAME.TrimStart('v'))'" | Set-Content phosphor/_build_version.py -Encoding utf8
          Get-Content phosphor/_build_version.py

      - name: Build PhosphorXP.exe
        run: >
          python -m PyInstaller --noconfirm --clean --log-level WARN
          --onedir --noconsole --name PhosphorXP --icon phosphor/assets/icon.ico
          --add-data "phosphor/assets;phosphor/assets"
          --hidden-import PIL.ImageTk
          --exclude-module matplotlib --exclude-module scipy --exclude-module pandas
          --exclude-module pytest --exclude-module IPython
          phosphor_xp.py

      - name: Package zip
        shell: pwsh
        run: |
          Copy-Item "share/READ ME FIRST.txt" dist/PhosphorXP/
          Copy-Item THIRD_PARTY.md dist/PhosphorXP/
          Copy-Item -Recurse third_party dist/PhosphorXP/third_party
          Compress-Archive -Path dist/PhosphorXP -DestinationPath PhosphorXP-windows.zip -CompressionLevel Optimal

      - name: Upload build (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: PhosphorXP-windows
          path: PhosphorXP-windows.zip

      - name: Publish release (tag pushes)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PhosphorXP-windows.zip
          generate_release_notes: true
          body: |
            **Download `PhosphorXP-windows.zip` below**, right-click > Extract All, then run `PhosphorXP\PhosphorXP.exe`. No Python needed.
            If Windows shows "Windows protected your PC", click **More info** > **Run anyway**.
